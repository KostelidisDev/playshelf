name: ${INSTANCE_NAME:-playshelf}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

services:
  playshelf:
    image: ${IMAGE_NAME:-ghcr.io/kostelidisdev/playshelf}:${IMAGE_TAG:-latest}
    container_name: ${INSTANCE_NAME:-playshelf}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: "${TZ:-Europe/Athens}"
      # The site's name (page title, app bar, installed app). Read when the
      # container starts: changing it needs a restart, not a rebuild.
      SITE_NAME: "${SITE_NAME:-PlayShelf}"
      # The site's description (search results, link previews, installed
      # app). Also read when the container starts.
      SITE_DESCRIPTION: "${SITE_DESCRIPTION:-A hand-picked collection of YouTube videos, from any creator, grouped by game.}"
      # The site's address. It sets the canonical link and the preview
      # image's address, and defaults to https://DOMAIN. Read when the
      # container starts.
      SITE_URL: "${SITE_URL:-https://${DOMAIN:-playshelf.kostelidis.dev}}"
    # The catalog (Games.txt and Videos.txt) and the thumbnails and covers
    # lie outside the image: two folders on the host, mounted read-only. For
    # NFS or CIFS/SMB shares, docker-compose.shares.yml replaces these two
    # mounts with volumes of its own, matched by target. create_host_path:
    # false makes compose fail when a folder is missing, rather than creating
    # an empty one and serving the demo catalog without a word.
    volumes:
      - type: bind
        source: ${PLAYSHELF_DATA_DIR:-/srv/playshelf/data}
        target: /usr/local/apache2/htdocs/assets/api
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${PLAYSHELF_THUMBNAILS_DIR:-/srv/playshelf/thumbnails}
        target: /usr/local/apache2/htdocs/assets/thumbnails
        read_only: true
        bind:
          create_host_path: false
    networks:
      - playshelf
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 5s
    deploy:
      resources:
        limits:
          # noinspection ComposeUnknownValues
          cpus: "${PLAYSHELF_CPU_LIMIT:-0.5}"
          # noinspection ComposeUnknownValues
          memory: "${PLAYSHELF_MEMORY_LIMIT:-64M}"
          # noinspection ComposeUnknownValues
          pids: ${PLAYSHELF_PIDS_LIMIT:-100}
        reservations:
          # noinspection ComposeUnknownValues
          memory: "${PLAYSHELF_MEMORY_RESERVATION:-32M}"
    labels:
      - "traefik.enable=true"
      # Router. TLS comes from the websecure entrypoint's default wildcard
      # certificate.
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}.rule=Host(`${DOMAIN:-playshelf.kostelidis.dev}`)"
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}.entrypoints=websecure"
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}.service=${INSTANCE_NAME:-playshelf}"
      # strict-path@file is a shared policy from the Traefik stack: a static
      # site needs no encoded characters in its paths.
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}.middlewares=strict-path@file"
      # The catalog editor has a host of its own, so it installs as an app
      # beside the site: a site installed on DOMAIN would take /studio/ into
      # its own app. The editor's pages and the files they load are served on
      # EDITOR_DOMAIN; anything else there goes to /studio/. /studio/ on DOMAIN
      # moves to the editor's host.
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}-editor.rule=Host(`${EDITOR_DOMAIN:-playshelf-studio.kostelidis.dev}`) && (PathPrefix(`/studio/`) || PathPrefix(`/assets/`))"
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}-editor.entrypoints=websecure"
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}-editor.service=${INSTANCE_NAME:-playshelf}"
      # The editor is always behind basic auth (PLAYSHELF_AUTH, see .env.example),
      # so the catalog can't be opened by anyone who finds the host.
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}-editor.middlewares=${INSTANCE_NAME:-playshelf}-auth,strict-path@file"
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}-editor-home.rule=Host(`${EDITOR_DOMAIN:-playshelf-studio.kostelidis.dev}`)"
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}-editor-home.entrypoints=websecure"
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}-editor-home.service=${INSTANCE_NAME:-playshelf}"
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}-editor-home.middlewares=${INSTANCE_NAME:-playshelf}-auth,${INSTANCE_NAME:-playshelf}-to-editor"
      # The users for the editor, and for the site when docker-compose.basic-auth.yml
      # is used too. Required: compose won't start without them.
      - "traefik.http.middlewares.${INSTANCE_NAME:-playshelf}-auth.basicauth.users=${PLAYSHELF_AUTH:?PLAYSHELF_AUTH is required: the editor is always behind basic auth}"
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}-studio-moved.rule=Host(`${DOMAIN:-playshelf.kostelidis.dev}`) && PathPrefix(`/studio/`)"
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}-studio-moved.entrypoints=websecure"
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}-studio-moved.service=${INSTANCE_NAME:-playshelf}"
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}-studio-moved.middlewares=${INSTANCE_NAME:-playshelf}-studio-moved"
      - "traefik.http.middlewares.${INSTANCE_NAME:-playshelf}-to-editor.redirectregex.regex=^https?://[^/]+/.*"
      - "traefik.http.middlewares.${INSTANCE_NAME:-playshelf}-to-editor.redirectregex.replacement=https://${EDITOR_DOMAIN:-playshelf-studio.kostelidis.dev}/studio/"
      - "traefik.http.middlewares.${INSTANCE_NAME:-playshelf}-to-editor.redirectregex.permanent=true"
      - "traefik.http.middlewares.${INSTANCE_NAME:-playshelf}-studio-moved.redirectregex.regex=^https?://[^/]+/studio/(.*)$"
      - "traefik.http.middlewares.${INSTANCE_NAME:-playshelf}-studio-moved.redirectregex.replacement=https://${EDITOR_DOMAIN:-playshelf-studio.kostelidis.dev}/studio/$$1"
      - "traefik.http.middlewares.${INSTANCE_NAME:-playshelf}-studio-moved.redirectregex.permanent=true"
      # Service
      - "traefik.http.services.${INSTANCE_NAME:-playshelf}.loadbalancer.server.port=8080"

networks:
  playshelf:
    name: ${INSTANCE_NAME:-playshelf}
    enable_ipv6: true
    ipam:
      config:
        - subnet: ${PLAYSHELF_NETWORK_SUBNET_V4:-10.100.0.0/24}
        - subnet: ${PLAYSHELF_NETWORK_SUBNET_V6:-fd00:100::/64}
