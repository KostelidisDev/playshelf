ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag MTime Size

# Protection against slow clients: a static site needs no long requests or
# request bodies.
Timeout 30
KeepAliveTimeout 5
LimitRequestBody 1024
LimitRequestFields 50
LimitRequestLine 4096

AddType application/manifest+json .webmanifest
AddType text/csv .csv
AddType text/javascript .js
AddDefaultCharset utf-8
AddCharset utf-8 .js .css .csv .webmanifest .svg

<Directory "/usr/local/apache2/htdocs">
    # No directory listings, no symlinks out of the document root, no
    # .htaccess files, and only the methods a static site needs.
    Options None
    AllowOverride None
    <LimitExcept GET HEAD>
        Require all denied
    </LimitExcept>
</Directory>

# Never serve dotfiles, backups, scripts or editor leftovers, should any end
# up in the document root (the thumbnail sync's .part files among them).
<FilesMatch "(^\.|~$|\.(bak|orig|swp|tmp|part|sh|py|conf)$)">
    Require all denied
</FilesMatch>

# ---------- Demo catalog ----------
#
# While the catalog volume has no videos.csv, the demo catalog built into
# the image (public/assets/demo/) is served in its place. This is checked on
# every request, so a real catalog is used as soon as it's there, with no
# restart.
RewriteEngine On
RewriteCond %{DOCUMENT_ROOT}/assets/api/videos.csv !-f
RewriteRule ^/assets/api/videos\.csv$ /assets/demo/videos.csv [PT]

# ---------- Security headers ----------
#
# Content-Security-Policy: scripts, styles, fonts and data from this origin
# only, and images also from YouTube's thumbnail host (shown until the sync
# has downloaded a thumbnail). No inline scripts, eval, plugins, framing,
# <base> or form posts. `style-src 'self'` still lets the app set CSS
# properties through the CSSOM (element.style.setProperty), but not through
# style="" attributes.
Header always set Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https://i.ytimg.com; connect-src 'self'; manifest-src 'self'; worker-src 'self'; font-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'"
Header always set X-Content-Type-Options "nosniff"
Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set Permissions-Policy "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()"
Header always set Cross-Origin-Opener-Policy "same-origin"
Header always set Cross-Origin-Resource-Policy "same-origin"
Header always set X-Permitted-Cross-Domain-Policies "none"
# Browsers only honour this over HTTPS, which Traefik provides in front of
# the container. No includeSubDomains: this site can't speak for every
# subdomain.
Header always set Strict-Transport-Security "max-age=31536000"
Header always unset X-Powered-By

# Browsers must always revalidate the service worker, so a deploy reaches
# them on the next visit.
<Files "sw.js">
    Header set Cache-Control "no-cache"
</Files>

# ---------- Site name ----------
#
# index.html and the web manifest contain a __SITE_NAME__ placeholder,
# replaced with the SITE_NAME environment variable as they're served
# (escaped for each by docker-entrypoint.sh), so one image serves any
# site. They're sent without validators: the file on disk doesn't change
# with SITE_NAME, so a 304 could keep showing an earlier name.
<Files "index.html">
    SetOutputFilter SUBSTITUTE
    Substitute "s|__SITE_NAME__|${SITE_NAME_HTML}|n"
    FileETag None
    Header unset Last-Modified
</Files>
<Files "manifest.webmanifest">
    SetOutputFilter SUBSTITUTE
    Substitute "s|__SITE_NAME__|${SITE_NAME_JSON}|n"
    FileETag None
    Header unset Last-Modified
</Files>

# ---------- Compression and caching ----------

AddOutputFilterByType DEFLATE text/html text/css text/plain text/xml text/csv \
    text/javascript application/javascript application/json application/manifest+json image/svg+xml

ExpiresActive On
ExpiresByType text/html "access plus 0 seconds"
# Browsers revalidate CSS and JS on every load (a cheap 304), so a page
# never runs against files from an earlier deploy. Offline use and fast
# repeat visits come from the service worker (sw.js).
ExpiresByType text/css "access plus 0 seconds"
ExpiresByType application/javascript "access plus 0 seconds"
ExpiresByType text/javascript "access plus 0 seconds"
ExpiresByType application/manifest+json "access plus 0 seconds"
ExpiresByType text/csv "access plus 0 seconds"
ExpiresByType image/* "access plus 1 month"
ExpiresByType font/* "access plus 1 year"
