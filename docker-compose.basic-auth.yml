# Basic auth in front of the site too. The catalog editor is always behind it
# (docker-compose.yml), and the users come from PLAYSHELF_AUTH there. This
# override adds the same middleware to the site's routers, so the site needs
# a login as well:
#
#   docker compose -f docker-compose.yml -f docker-compose.basic-auth.yml up -d
#
# The middleware replaces the one docker-compose.yml sets on the same routers.
services:
  playshelf:
    labels:
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}.middlewares=${INSTANCE_NAME:-playshelf}-auth,strict-path@file"
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}-studio-moved.middlewares=${INSTANCE_NAME:-playshelf}-auth,${INSTANCE_NAME:-playshelf}-studio-moved"
