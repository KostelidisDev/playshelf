name: ${INSTANCE_NAME:-playshelf}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

services:
  playshelf:
    image: ${IMAGE_NAME:-ghcr.io/kostelidisdev/playshelf}:${IMAGE_TAG:-latest}
    container_name: ${INSTANCE_NAME:-playshelf}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: "${TZ:-Europe/Athens}"
      # The site's name (page title, app bar, installed app). Read when the
      # container starts: changing it needs a restart, not a rebuild.
      SITE_NAME: "${SITE_NAME:-PlayShelf}"
      # The site's description (search results, link previews, installed
      # app). Also read when the container starts.
      SITE_DESCRIPTION: "${SITE_DESCRIPTION:-A hand-picked collection of YouTube videos, from any creator, grouped by game.}"
    # The catalog (Games.txt and Videos.txt, read-only) lives outside the
    # image; the volume is defined at the end. With nocopy, Docker never
    # copies the image's empty directory into the data mount.
    volumes:
      - type: volume
        source: data
        target: /usr/local/apache2/htdocs/assets/api
        read_only: true
        volume:
          nocopy: true
    networks:
      - playshelf
    logging: *default-logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
      start_interval: 5s
    deploy:
      resources:
        limits:
          # noinspection ComposeUnknownValues
          cpus: "${PLAYSHELF_CPU_LIMIT:-0.5}"
          # noinspection ComposeUnknownValues
          memory: "${PLAYSHELF_MEMORY_LIMIT:-64M}"
          # noinspection ComposeUnknownValues
          pids: ${PLAYSHELF_PIDS_LIMIT:-100}
        reservations:
          # noinspection ComposeUnknownValues
          memory: "${PLAYSHELF_MEMORY_RESERVATION:-32M}"
    labels:
      - "traefik.enable=true"
      # Router. TLS comes from the websecure entrypoint's default wildcard
      # certificate.
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}.rule=Host(`${DOMAIN:?DOMAIN is required}`)"
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}.entrypoints=websecure"
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}.service=${INSTANCE_NAME:-playshelf}"
      # strict-path@file is a shared policy from the Traefik stack: a static
      # site needs no encoded characters in its paths.
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}.middlewares=${INSTANCE_NAME:-playshelf}-auth,strict-path@file"
      # Middlewares
      - "traefik.http.middlewares.${INSTANCE_NAME:-playshelf}-auth.basicauth.users=${PLAYSHELF_AUTH:?PLAYSHELF_AUTH is required}"
      # The catalog editor has a host of its own, so it installs as an app
      # beside the site: a site installed on DOMAIN would take /studio/ into
      # its own app. The editor's pages and the files they load are served on
      # EDITOR_DOMAIN; anything else there goes to /studio/. /studio/ on DOMAIN
      # moves to the editor's host.
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}-editor.rule=Host(`${EDITOR_DOMAIN:?EDITOR_DOMAIN is required}`) && (PathPrefix(`/studio/`) || PathPrefix(`/assets/`))"
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}-editor.entrypoints=websecure"
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}-editor.service=${INSTANCE_NAME:-playshelf}"
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}-editor.middlewares=${INSTANCE_NAME:-playshelf}-auth,strict-path@file"
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}-editor-home.rule=Host(`${EDITOR_DOMAIN}`)"
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}-editor-home.entrypoints=websecure"
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}-editor-home.service=${INSTANCE_NAME:-playshelf}"
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}-editor-home.middlewares=${INSTANCE_NAME:-playshelf}-auth,${INSTANCE_NAME:-playshelf}-to-editor"
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}-studio-moved.rule=Host(`${DOMAIN}`) && PathPrefix(`/studio/`)"
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}-studio-moved.entrypoints=websecure"
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}-studio-moved.service=${INSTANCE_NAME:-playshelf}"
      - "traefik.http.routers.${INSTANCE_NAME:-playshelf}-studio-moved.middlewares=${INSTANCE_NAME:-playshelf}-auth,${INSTANCE_NAME:-playshelf}-studio-moved"
      - "traefik.http.middlewares.${INSTANCE_NAME:-playshelf}-to-editor.redirectregex.regex=^https?://[^/]+/.*"
      - "traefik.http.middlewares.${INSTANCE_NAME:-playshelf}-to-editor.redirectregex.replacement=https://${EDITOR_DOMAIN}/studio/"
      - "traefik.http.middlewares.${INSTANCE_NAME:-playshelf}-to-editor.redirectregex.permanent=true"
      - "traefik.http.middlewares.${INSTANCE_NAME:-playshelf}-studio-moved.redirectregex.regex=^https?://[^/]+/studio/(.*)$"
      - "traefik.http.middlewares.${INSTANCE_NAME:-playshelf}-studio-moved.redirectregex.replacement=https://${EDITOR_DOMAIN}/studio/$$1"
      - "traefik.http.middlewares.${INSTANCE_NAME:-playshelf}-studio-moved.redirectregex.permanent=true"
      # Service
      - "traefik.http.services.${INSTANCE_NAME:-playshelf}.loadbalancer.server.port=8080"

networks:
  playshelf:
    name: ${INSTANCE_NAME:-playshelf}
    enable_ipv6: true
    ipam:
      config:
        - subnet: ${PLAYSHELF_NETWORK_SUBNET_V4:-10.100.0.0/24}
        - subnet: ${PLAYSHELF_NETWORK_SUBNET_V6:-fd00:100::/64}

# data holds Games.txt and Videos.txt: a bind mount, an NFS export or a CIFS/SMB share, set
# by the three PLAYSHELF_DATA_VOLUME_* variables (examples in .env.example).
# The container runs as uid/gid 82 (www-data), which must be able to read
# it. Docker keeps a volume's settings from when it was created: after
# changing them, `docker compose down` and `docker volume rm` the volume.
volumes:
  data:
    name: ${INSTANCE_NAME:-playshelf}-data
    driver: local
    driver_opts:
      type: "${PLAYSHELF_DATA_VOLUME_TYPE:-none}"
      o: "${PLAYSHELF_DATA_VOLUME_OPTIONS:-bind}"
      device: "${PLAYSHELF_DATA_VOLUME_DEVICE:?PLAYSHELF_DATA_VOLUME_DEVICE is required}"
