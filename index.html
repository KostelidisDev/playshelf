<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- __CHANNEL_NAME__ is replaced as the page is served: by Apache from
       the CHANNEL_NAME environment variable (site.conf), or by
       build/channel.ts under `vite dev` and `vite preview`. The app reads the
       name from the application-name meta tag. -->
  <title>__CHANNEL_NAME__</title>
  <meta name="application-name" content="__CHANNEL_NAME__">
  <meta name="description" content="A hand-picked collection of YouTube videos, from any creator, grouped by game.">
  <meta name="author" content="__CHANNEL_NAME__">
  <meta name="publisher" content="__CHANNEL_NAME__">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1e1e1e">

  <!-- Installable app. crossorigin="use-credentials": browsers fetch the
       manifest without credentials otherwise, and basic auth would reject it. -->
  <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
  <link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="__CHANNEL_NAME__">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
